<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HackDekh — Discover Hackathons, Check Fit &amp; Track Deadlines</title>
  <meta name="description"
    content="Find live hackathons from Devfolio, Unstop, Devpost, MLH, and Hack2Skill in one feed. Check if an event fits your city and prize goals, get 24h deadline alerts, and sync with your team." />
  <meta name="keywords"
    content="hackathons, student hackathons, Devfolio hackathons, Unstop hackathons, Devpost, MLH, Hack2Skill, hackathon tracker, coding competitions, hackathon team" />
  <meta name="author" content="HackDekh" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#09090b" />
  <link rel="canonical" href="https://hackdekh.jdecodes.tech/" />

  <!-- Favicon & App Manifest -->
  <link rel="icon" type="image/png" href="/BrandImages/HackDekh.png" />
  <link rel="apple-touch-icon" href="/BrandImages/HackDekh.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HackDekh" />
  <meta property="og:title" content="HackDekh — Discover Hackathons, Check Fit &amp; Track Deadlines" />
  <meta property="og:description"
    content="Live hackathons from Devfolio, Unstop, Devpost, MLH, and Hack2Skill. Check if an event is worth your weekend, get 24h deadline alerts, and coordinate with your team." />
  <meta property="og:url" content="https://hackdekh.jdecodes.tech/" />
  <meta property="og:image" content="https://hackdekh.jdecodes.tech/BrandImages/HackDekhBanner.png" />
  <meta property="og:image:alt" content="HackDekh — Hackathon Discovery, Fit Check &amp; Team Tracker" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HackDekh — Discover Hackathons, Check Fit &amp; Track Deadlines" />
  <meta name="twitter:description"
    content="Live hackathons from Devfolio, Unstop, Devpost, MLH, and Hack2Skill. Check fit, get 24h deadline alerts, and sync with your team." />
  <meta name="twitter:image" content="https://hackdekh.jdecodes.tech/BrandImages/HackDekhBanner.png" />

  <!-- Structured Data (WebSite + WebApplication) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "HackDekh",
            "url": "https://hackdekh.jdecodes.tech/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://hackdekh.jdecodes.tech/hackathons?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "WebApplication",
            "name": "HackDekh",
            "url": "https://hackdekh.jdecodes.tech/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web",
            "description": "Centralized hackathon discovery, fit check, 24h deadline alerts, and team tracker for students and builders.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "INR"
            }
          }
        ]
      }
    </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
